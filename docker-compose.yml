# Ambiente local de desenvolvimento (INF-02). Credenciais só para uso local.
#
# Primeira vez:   cp .env.example .env      (ajuste portas e senhas se precisar)
# Tudo:           docker compose up -d --build
# Só a infra:     docker compose up -d postgres seaweedfs seaweedfs-init redis mailpit
#                 (e rode a API com "dotnet run", ver README)
#
# Porta ocupada? Troque a porta correspondente no .env. As portas do lado esquerdo são as do seu computador.
name: funeraria

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: funeraria
      POSTGRES_USER: funeraria
      POSTGRES_PASSWORD: funeraria
    ports:
      # 5433 por padrão para não conflitar com um PostgreSQL instalado no Windows (que usa a 5432).
      - "${POSTGRES_PORTA:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funeraria -d funeraria"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      seaweedfs-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=funeraria;Username=funeraria;Password=funeraria"
      # Convites e avisos chegam no Mailpit: http://localhost:8025
      Email__Smtp__Host: mailpit
      Email__Smtp__Porta: "1025"
      # Arquivos no SeaweedFS; os links temporários usam o endereço que o navegador alcança.
      Armazenamento__S3__ServiceUrl: http://seaweedfs:8333
      Armazenamento__S3__UrlPublica: http://localhost:${S3_PORTA:-8333}
      Jwt__ChaveAssinatura: ${JWT_CHAVE_ASSINATURA:?Copie .env.example para .env antes de subir a API}
      Seed__AdminSenha: ${SEED_ADMIN_SENHA:-}
      Seed__SenhaDemo: ${SEED_SENHA_DEMO:-}
    ports:
      # Swagger em http://localhost:5080/swagger
      - "${API_PORTA:-5080}:8080"

  # Armazenamento compatível com S3 (INF-18). Substitui a MinIO, que deixou de publicar imagens públicas.
  # Endpoint S3: http://localhost:8333, access key "funeraria", secret "funeraria123" (docker/seaweedfs/s3.json).
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=0
    ports:
      - "${S3_PORTA:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Cria o bucket inicial. Roda uma vez e termina.
  seaweedfs-init:
    image: chrislusf/seaweedfs:3.97
    depends_on:
      - seaweedfs
    # Tenta até o filer ficar pronto e o bucket aparecer na listagem.
    entrypoint: >
      /bin/sh -c "
      for tentativa in $$(seq 1 60); do
        echo 's3.bucket.create -name funeraria-documentos' | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 >/dev/null 2>&1;
        if echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 2>/dev/null | grep -q funeraria-documentos; then
          echo 'Bucket funeraria-documentos pronto.'; exit 0;
        fi;
        sleep 2;
      done;
      echo 'Não foi possível criar o bucket funeraria-documentos.'; exit 1
      "

  # Cache e backplane do SignalR (INF-19, opcional).
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORTA:-6379}:6379"

  # Captura os e-mails enviados em desenvolvimento. Interface em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "${SMTP_PORTA:-1025}:1025"
      - "${MAILPIT_PORTA:-8025}:8025"

  # Logs estruturados em desenvolvimento (INF-08, opcional). Interface em http://localhost:5341
  # Suba com: docker compose --profile tools up -d seq
  seq:
    image: datalust/seq:2025.2
    profiles: ["tools"]
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "${SEQ_PORTA:-5341}:80"

  # Já abre com o servidor "Funerária (local)" cadastrado e sem tela de login (modo desktop, só para uso local).
  # O pgpass é copiado para /tmp com permissão 600: montado direto do Windows, o libpq ignoraria o arquivo.
  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["tools"]
    entrypoint: ["/bin/sh", "-c", "cp /pgadmin-config/pgpass /tmp/pgpass && chmod 600 /tmp/pgpass && exec /entrypoint.sh"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@funeraria.localhost
      PGADMIN_DEFAULT_PASSWORD: funeraria
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # O pgAdmin recusa e-mails em domínios reservados (.localhost) sem esta opção.
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['localhost']"
      PGADMIN_SERVER_JSON_FILE: /pgadmin-config/servers.json
    volumes:
      - ./docker/pgadmin:/pgadmin-config:ro
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORTA:-5050}:80"
    depends_on:
      - postgres

volumes:
  postgres-data:
  pgadmin-data:
  seaweedfs-data:
